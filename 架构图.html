<style>
:root {
  color-scheme: light;
  --surface: #F7F7F8;
  --surface-muted: #EFEFF2;
  --text: #171717;
  --text-muted: #52525B;
  --border: rgba(23, 23, 23, 0.12);

  --brand: #4B3FE3;
  --brand-soft: #F2F7FF;
  --brand-soft-strong: #E5EAFF;
  --brand-text: #1A1759;
  --brand-on: #FFFFFF;
  --chart-series-1: #3C2ECA;
  --chart-series-2: #A9AEFF;
  --chart-series-3: #6F6FFF;
  --chart-series-4: #22A5F7;
  --chart-other: #D3D4DA;

  --accent: #27D2BF;
  --accent-soft: #EAFBF8;
  --accent-text: #0F766E;

  --radius: 8px;
  --radius-card: 12px;
  --radius-full: 999px;
  --spacer-4: 4px;
  --spacer-8: 8px;
  --spacer-12: 12px;
  --spacer-16: 16px;
  --spacer-20: 20px;
  --spacer-24: 24px;
  --font-sans: "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-strong: 600;
  --text-caption: 12px/18px;
  --text-body: 14px/20px;
  --text-title: 16px/24px;
  --text-code: 13px/20px;
}
:root[data-widget-theme="dark"] {
  color-scheme: dark;
  --surface: #171717;
  --surface-muted: #262626;
  --text: #E5E5E5;
  --text-muted: #A1A1AA;
  --border: rgba(229, 229, 229, 0.12);
  --brand: #6054F1;
  --brand-soft: #1A1759;
  --brand-soft-strong: #3C2ECA;
  --brand-text: #CFD8FF;
  --chart-series-1: #4B3FE3;
  --accent-soft: #123F3C;
  --accent-text: #CCFBF1;
}
.widget {
  color: var(--text);
  background: transparent;
  font: var(--weight-regular) var(--text-body) var(--font-sans);
  letter-spacing: 0;
}
.arch-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: var(--spacer-20);
}
.arch-title {
  font: var(--weight-medium) var(--text-title) var(--font-sans);
  color: var(--text);
  margin: 0 0 var(--spacer-4) 0;
}
.arch-sub {
  font: var(--weight-regular) var(--text-caption) var(--font-sans);
  color: var(--text-muted);
  margin: 0 0 var(--spacer-16) 0;
}
.arch-svg-wrap {
  width: 100%;
  overflow-x: auto;
}
.arch-svg-wrap svg {
  width: 100%;
  height: auto;
  min-width: 680px;
  display: block;
}
.legend-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--spacer-16);
  margin-top: var(--spacer-16);
  padding-top: var(--spacer-12);
  border-top: 1px dashed var(--border);
}
.legend-item {
  display: inline-flex;
  align-items: center;
  gap: var(--spacer-8);
  font: var(--weight-regular) var(--text-caption) var(--font-sans);
  color: var(--text-muted);
}
.legend-swatch {
  width: 14px;
  height: 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
}
.legend-swatch.brand { background: var(--brand-soft); border-color: var(--brand); }
.legend-line {
  width: 22px;
  height: 0;
  border-top: 2px solid var(--text-muted);
}
.legend-line.brand-dash {
  border-top: 2px dashed var(--brand);
}
</style>

<div class="widget arch-card" data-dynamic-ui-widget data-template="architecture-elements">
  <h3 class="arch-title">校园生活服务平台 · 三层架构</h3>

      </g>
